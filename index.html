<!DOCTYPE html>
<html>

<head>
    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Password Generator</h1>

        <label for="length">
            Password Length:
        </label>

        <input
            type="number"
            id="length"
            min="4"
            max="30"
            value="12"
        >

        <label>
            <input
                type="checkbox"
                id="uppercase"
                checked
            >
            Uppercase (A-Z)
        </label>

        <br>

        <label>
            <input
                type="checkbox"
                id="lowercase"
                checked
            >
            Lowercase (a-z)
        </label>

        <br>

        <label>
            <input
                type="checkbox"
                id="numbers"
                checked
            >
            Numbers (0-9)
        </label>

        <br>

        <label>
            <input
                type="checkbox"
                id="symbols"
                checked
            >
            Symbols (!@#$)
        </label>

        <input
            type="text"
            id="password"
            readonly
        >

        <p id="strength"></p>

        <button
            class="generate-btn"
            onclick="generatePassword()"
        >
            Generate Password
        </button>

        <button
            class="copy-btn"
            onclick="copyPassword()"
        >
            Copy Password
        </button>

    </div>

    <script src="./script.js"></script>

</body>

</html>
